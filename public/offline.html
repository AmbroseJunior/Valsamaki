<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Valsamaki</title>
  <style>
    :root { --olive: #5C7A3E; --cream: #F7F3EC; --muted: #6B5A42; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: #1A1510;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 1rem;
      padding: 3rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: var(--muted); font-size: 0.9375rem; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: var(--olive);
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 2rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      width: 100%;
    }
    button:hover { opacity: 0.85; }
    .footer { margin-top: 2rem; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🫒</div>
    <h1>You're offline</h1>
    <p>No internet connection detected. Valsamaki works offline — cached businesses, events, and your saved content are still available.</p>
    <button onclick="window.location.reload()">Try again</button>
    <div class="footer">Powered By Valsamaki 2026</div>
  </div>
</body>
</html>
